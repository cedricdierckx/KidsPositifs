apply plugin: 'com.android.application'

// Google Play refuse un versionCode déjà utilisé, même entre pistes de test
// différentes (interne vs fermé) — un chiffre en dur oublié à incrémenter a
// déjà bloqué un envoi. Le nombre de commits sur la branche courante est
// strictement croissant par construction : jamais de collision possible,
// rien à retenir de manuel.
//
// Source 1 (prioritaire) : android/versionCode.txt, écrit par
// `npm run cap:sync` (scripts/sync-www.mjs) au moment où `git` tourne dans
// l'environnement npm, fiable. Nécessaire car le démon Gradle lancé par
// Android Studio, appli graphique Windows, hérite du PATH de la session au
// démarrage — sans `git` dedans même quand PowerShell le trouve très bien,
// l'appel direct ci-dessous retombait silencieusement sur 1.
// Source 2 (repli) : appel direct à git, pour un build hors npm (CI, ligne
// de commande Gradle seule) où l'environnement est fiable.
// Source 3 (dernier repli) : 1, pour ne jamais faire échouer le build.
def versionCodeDepuisGit = {
    def fichier = new File(rootProject.projectDir, "versionCode.txt")
    if (fichier.exists()) {
        try {
            return Integer.parseInt(fichier.text.trim())
        } catch (Exception ignoree) { /* fichier corrompu : on retente par git */ }
    }
    try {
        def sortie = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            workingDir rootProject.projectDir
            standardOutput = sortie
        }
        return Integer.parseInt(sortie.toString().trim())
    } catch (Exception ignoree) {
        return 1
    }
}

android {
    namespace = "team.fami.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "team.fami.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeDepuisGit()
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // 'proguard-android.txt' n'est plus fourni par l'AGP récent (il embarquait
            // -dontoptimize, incompatible avec les optimisations R8) — utiliser la
            // variante '-optimize' à la place. Sans effet ici puisque minifyEnabled
            // est false, mais Gradle valide ce fichier dès la configuration, avant
            // même de savoir si la minification tourne.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
