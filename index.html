<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Propriété du domaine, exigée par Google avant d'afficher « FamiTeam »
       et son logo sur l'écran de consentement : sans elle, il affiche l'hôte
       de l'URI de redirection (…supabase.co). Ne pas retirer. -->
  <meta name="google-site-verification" content="Yx5wnuzEwc3s68p3iLiFCp4BTrk4iFpVcIsFYrYk328">
  <meta name="theme-color" content="#f6a623">
  <title>FamiTeam — Une ambiance positive en famille</title>
  <meta name="description" content="Application familiale gratuite pour les 2-7 ans : deux minutes par jour pour valoriser les comportements positifs. Aucun point n'est jamais retiré — quand ça dérape, l'enfant répare. Sans publicité, données en Europe.">
  <meta property="og:title" content="FamiTeam — Une ambiance positive en famille">
  <meta property="og:description" content="Deux minutes par jour, en famille : valoriser les comportements positifs des 2-7 ans, sans jamais retirer de points. Gratuit, sans publicité.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://famiteam.com/">
  <meta property="og:image" content="https://famiteam.com/images/apercu-enfant.png">
  <meta property="og:locale" content="fr_BE">
  <meta property="og:site_name" content="FamiTeam">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://famiteam.com/">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "FamiTeam",
    "applicationCategory": "LifestyleApplication",
    "operatingSystem": "Tout navigateur web",
    "url": "https://famiteam.com/",
    "inLanguage": ["fr", "en", "nl", "de"],
    "audience": { "@type": "PeopleAudience", "suggestedMinAge": 2, "suggestedMaxAge": 7 },
    "description": "Application familiale gratuite pour les enfants de 2 à 7 ans : deux minutes par jour pour valoriser les comportements positifs, sans jamais retirer de points. Quand quelque chose se passe mal, l'enfant répare — et c'est la réparation qui est récompensée.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
    "isAccessibleForFree": true
  }
  </script>
  <link rel="stylesheet" href="css/style.css?v=159">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌟</text></svg>">
</head>
<body>
  <noscript>Active JavaScript pour utiliser FamiTeam.</noscript>

  <!-- Écran de démarrage. L'application attend la session et les réglages
       avant de peindre son premier écran ; jusque-là, le <body> ne contenait
       que des <script> — donc une page blanche, qui ressemble à une panne sur
       un téléphone au réseau lent. Ce décor est écrit ici, en dur, pour
       s'afficher au tout premier rendu, avant l'exécution du moindre script.
       Il n'a pas besoin d'être retiré : le premier écran remplace le contenu
       du <body> (voir initSquelette / ecranAuth). -->
  <div id="demarrage" class="demarrage" role="status" aria-live="polite">
    <div class="dem-ciel" aria-hidden="true">
      <span class="s1">⭐</span><span class="s2">✨</span><span class="s3">⭐</span>
      <span class="s4">✨</span><span class="s5">⭐</span><span class="s6">✨</span>
    </div>
    <div class="dem-ballons" aria-hidden="true">
      <span class="b1">🎈</span><span class="b2">🎈</span><span class="b3">🎈</span>
    </div>
    <span class="dem-astre" aria-hidden="true">🌟</span>
    <div class="dem-titre">FamiTeam</div>
    <div id="dem-message" class="dem-message">On réveille les étoiles…</div>
    <div class="dem-points" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="dem-lent" class="dem-lent" hidden></div>
  </div>

  <script defer src="js/demarrage.js?v=159"></script>
  <script defer src="js/config.js?v=159"></script>
  <script defer src="js/i18n.base.js?v=159"></script>
  <!-- Le français est dans i18n.base.js ; l'anglais, le néerlandais et
       l'allemand sont trois fichiers séparés d'environ 80 Ko qu'on ne tire
       que si le parent lit cette langue-là. `document.write` insère la balise
       ICI, pendant l'analyse, donc dans l'ordre : un script ajouté par
       createElement n'aurait aucun ordre garanti face aux scripts différés.
       Même règle de choix que detecterLangue(), sinon un parent ayant choisi
       le français se verrait tirer un fichier pour rien. -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem("kp_langue");
        var l = (m && /^(fr|en|nl|de)$/.test(m)) ? m
              : ((navigator.language || "fr").slice(0, 2).toLowerCase());
        if (/^(en|nl|de)$/.test(l)) {
          document.write('<script defer src="js/i18n.' + l + '.js?v=159"><\/script>');
        }
      } catch (e) { /* sans stockage : le français suffit */ }
    })();
  </script>
  <script defer src="js/vendor/supabase.js?v=159"></script>
  <script defer src="js/data.js?v=159"></script>
  <script defer src="js/avatar.js?v=159"></script>
  <script defer src="js/qr.js?v=159"></script>
  <script defer src="js/croissance.js?v=159"></script>
  <script defer src="js/app.js?v=159"></script>
  <script defer src="js/store.js?v=159"></script>
  <script defer src="js/ui.js?v=159"></script>
  <script defer src="js/auth.js?v=159"></script>
</body>
</html>
